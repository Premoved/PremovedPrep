<div class="auth-page">
	<div class="auth-stage" [class.two-up]="botCheck.challenge() !== null">
		@if (botCheck.challenge(); as challenge) {
			<aside class="auth-aside">
				<app-bot-check [challenge]="challenge" (solved)="onBotCheckSolved($event)"></app-bot-check>
			</aside>
		}
		<div class="auth-card">
			<div class="brand">
				<app-logo class="logo"></app-logo>
			</div>
			<h1>Create an account</h1>

			<form (submit)="submit($event)">
				<label for="register-username">Username</label>
				<input
					id="register-username"
					type="text"
					name="username"
					autocomplete="username"
					required
					[value]="username()"
					(input)="onUsername($event)"
					(blur)="touchedUsername.set(true)"
				/>
				<p class="hint">{{ usernameHint() }}</p>

				<label for="register-email">Email</label>
				<input
					id="register-email"
					type="email"
					name="email"
					autocomplete="email"
					required
					[value]="email()"
					(input)="onEmail($event)"
				/>

				<label for="register-password">Password</label>
				<input
					id="register-password"
					type="password"
					name="password"
					autocomplete="new-password"
					required
					[value]="password()"
					(input)="onPassword($event)"
					(blur)="touchedPassword.set(true)"
				/>
				<p class="hint">{{ passwordHint() }}</p>

				@if (error(); as message) {
					<div class="error" role="alert">{{ message }}</div>
				}

				<button type="submit" class="primary" [disabled]="!canSubmit() || botCheck.blocked()">
					{{ submitting() ? 'Creating…' : 'Create account' }}
				</button>
			</form>

			<p class="switch">Already have one? <a routerLink="/login">Sign in</a></p>
			<p class="switch"><a routerLink="/home">Continue without an account</a></p>
		</div>
	</div>
</div>
