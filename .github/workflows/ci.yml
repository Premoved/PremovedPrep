name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # Clean install from package-lock.json.
      - run: npm ci

      # Fail fast.
      - name: Formatting
        run: npx prettier --check "src/**/*.{ts,scss,css}" "tools/*.mjs"

      - name: Signal calls in templates
        run: npm run check:signals

      - name: Types (app)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Types (specs)
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false

      # Template type-check and budgets; piece/sound assets are skipped in CI.
      - name: Production build
        run: npm run build
        env:
          PREMOVEDPREP_SKIP_ASSETS: '1'

      # Advisory only.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
